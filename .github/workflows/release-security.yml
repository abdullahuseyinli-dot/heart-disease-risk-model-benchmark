name: Release candidate evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HEARTSHIFT_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  WANDB_MODE: offline
  WANDB_DISABLED: "true"
  UV_NO_PROGRESS: "1"

jobs:
  release-candidate:
    name: Exact candidate and release gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out complete history without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd6 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked release environment
        run: >-
          uv sync --locked --extra dev --extra reporting --extra neural-cpu
          --group release

      - name: Prepare candidate-scoped reports
        shell: bash
        run: mkdir -p ".audit/release/${GITHUB_SHA}"

      - name: Scan the exact candidate tree
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          uv run heartshift release scan \
            --candidate "${GITHUB_SHA}" \
            --policy configs/release/release_gate_policy_v1.json \
            --output "${report_dir}/candidate-tree.json"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate candidate_tree --status pass \
            --evidence "${report_dir}/candidate-tree.json" \
            --output "${report_dir}/candidate_tree.status.json"

      - name: Validate release-facing contract metadata
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          {
            uv run heartshift contracts validate --repo-root .
            uv run heartshift methods validate --repo-root .
          } 2>&1 | tee "${report_dir}/contracts.log"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate contracts --status pass \
            --evidence "${report_dir}/contracts.log" \
            --output "${report_dir}/contracts.status.json"

      - name: Validate public repository surface
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          uv run python tools/validate_repository.py 2>&1 | tee "${report_dir}/repository.log"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate repository --status pass \
            --evidence "${report_dir}/repository.log" \
            --output "${report_dir}/repository.status.json"

      - name: Run tests and measured coverage gate
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          uv run pytest -q -m "not full_evidence" --cov=heartshift \
            --cov-config=configs/coverage/source-only.coveragerc \
            --cov-report=term-missing --cov-report=xml \
            2>&1 | tee "${report_dir}/pytest.log"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate tests --status pass \
            --evidence "${report_dir}/pytest.log" \
            --output "${report_dir}/tests.status.json"

      - name: Lint
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          uv run ruff check src tests tools 2>&1 | tee "${report_dir}/ruff-check.log"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate lint --status pass \
            --evidence "${report_dir}/ruff-check.log" \
            --output "${report_dir}/lint.status.json"

      - name: Check formatting
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          uv run ruff format --check src tests tools 2>&1 | tee "${report_dir}/ruff-format.log"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate format --status pass \
            --evidence "${report_dir}/ruff-format.log" \
            --output "${report_dir}/format.status.json"

      - name: Strict type-check
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          uv run mypy 2>&1 | tee "${report_dir}/mypy.log"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate typing --status pass \
            --evidence "${report_dir}/mypy.log" \
            --output "${report_dir}/typing.status.json"

      - name: Build distributions
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          uv build 2>&1 | tee "${report_dir}/build.log"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate build --status pass \
            --evidence "${report_dir}/build.log" \
            --output "${report_dir}/build.status.json"

      - name: Validate distribution boundary
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          uv run python tools/validate_distribution.py 2>&1 | tee "${report_dir}/distribution.log"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate distribution --status pass \
            --evidence "${report_dir}/distribution.log" \
            --output "${report_dir}/distribution.status.json"

      - name: Smoke-test clean wheel
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          uv run python tools/smoke_install_distribution.py 2>&1 | tee "${report_dir}/wheel-smoke.log"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate wheel_smoke --status pass \
            --evidence "${report_dir}/wheel-smoke.log" \
            --output "${report_dir}/wheel_smoke.status.json"

      - name: Record dependency licences
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          uv run pip-licenses --format=json --with-urls \
            --output-file="${report_dir}/python-licenses.json"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate licenses --status pass \
            --evidence "${report_dir}/python-licenses.json" \
            --output "${report_dir}/licenses.status.json"

      - name: Download and verify Gitleaks 8.30.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "${report_dir}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${report_dir}/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${report_dir}/gitleaks_8.30.1_linux_x64.tar.gz" \
            -C "${report_dir}" gitleaks
          test "$("${report_dir}/gitleaks" version)" = "8.30.1"

      - name: Scan complete Git history for secrets
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          "${report_dir}/gitleaks" git --no-banner --redact=100 \
            --config .gitleaks.toml --log-opts=--all --report-format json \
            --report-path "${report_dir}/gitleaks.json"
          test -f "${report_dir}/gitleaks.json" || printf '[]\n' > "${report_dir}/gitleaks.json"
          uv run heartshift release record-gate \
            --candidate "${GITHUB_SHA}" --gate history_secret_scan --status pass \
            --evidence "${report_dir}/gitleaks.json" \
            --output "${report_dir}/history_secret_scan.status.json"

      - name: Assemble candidate attestation
        if: always()
        shell: bash
        run: |
          report_dir=".audit/release/${GITHUB_SHA}"
          uv run heartshift release assemble \
            --candidate "${GITHUB_SHA}" --version 0.1.0 \
            --policy configs/release/release_gate_policy_v1.json \
            --status-directory "${report_dir}" \
            --output "${report_dir}/candidate-attestation.json" \
            --mode candidate_attestation

      - name: Upload candidate-scoped evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-candidate-${{ github.sha }}
          path: .audit/release/${{ github.sha }}/
          if-no-files-found: error
          retention-days: 90
