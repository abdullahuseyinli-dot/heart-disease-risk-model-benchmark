name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HEARTSHIFT_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  WANDB_MODE: offline
  WANDB_DISABLED: "true"
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"

    steps:
      - name: Check out source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Compile Python sources
        run: uv run python -m compileall -q src scripts tools

      - name: Run tests
        run: uv run pytest -q --cov=heartshift --cov-report=term-missing --cov-report=xml --cov-fail-under=45

      - name: Lint
        run: uv run ruff check src tests tools

      - name: Check formatting
        run: uv run ruff format --check src tests tools

      - name: Type-check
        run: uv run mypy src/heartshift

      - name: Smoke-test installed command
        run: uv run heartshift-validate --help

      - name: Validate public repository surface
        run: uv run python tools/validate_repository.py

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate distribution contents
        run: uv run python tools/validate_distribution.py

      - name: Smoke-test clean wheel installation
        run: uv run python tools/smoke_install_distribution.py
