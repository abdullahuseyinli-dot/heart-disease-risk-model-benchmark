protocol_version: observed-backbones-consumed-development-v1
status: consumed_uci_development_only
device: cuda
seeds: [5062, 5063, 5064, 5065, 5066, 5067, 5068, 5069, 5070, 5071]
inner_mask_replicates: 5
inner_evaluation_seed: 5062
features: [age, sex, cp, trestbps, chol, fbs, restecg, thalach, exang, oldpeak, slope, ca, thal]
data:
  canonical_path: data/processed/uci_heart_canonical_v1.parquet
  outer_manifest: data/splits/uci_heart_outer_loho_v1.parquet
  inner_manifest: data/splits/uci_heart_inner_loho_v1.parquet
selection:
  metric: 0.5_mean_plus_0.5_worst_policy_balanced_log_loss
common_parameters:
  d_model: 64
  n_heads: 4
  n_layers: 2
  dropout: 0.1
  learning_rate: 0.0005
  weight_decay: 0.001
  max_epochs: 120
  evaluation_interval: 5
  patience_evaluations: 8
  validation_mask_replicates: 2
  dro_lambda: 0.5
  dro_tau: 0.2
  brier_beta: 0.1
experiments:
  - name: v2_attention_equal_budget
    variant: v2
    parameters: {backbone: attention, brier_beta: 0.0}
  - name: v2_deepsets_equal_budget
    variant: v2
    parameters: {backbone: deepsets, brier_beta: 0.0}
  - name: v5_attention_equal_budget
    variant: v5
    parameters: {backbone: attention}
  - name: v5_deepsets_equal_budget
    variant: v5
    parameters: {backbone: deepsets}
