protocol_version: modern-2026-inner-v1
seeds: [5062, 5063, 5064]
data:
  canonical_path: data/processed/uci_heart_canonical_v1.parquet
  outer_manifest: data/splits/uci_heart_outer_loho_v1.parquet
  inner_manifest: data/splits/uci_heart_inner_loho_v1.parquet
selection:
  metric: 0.5_mean_plus_0.5_worst_balanced_log_loss
models:
  - name: realmlp
    weighting: pooled
    grid:
      device: [cuda]
      n_epochs: [256]
      batch_size: [128]
  - name: ft_transformer
    weighting: pooled
    grid:
      device: [cuda]
      max_epochs: [200]
      batch_size: [128]
      patience: [20]
  - name: tabm
    weighting: pooled
    grid:
      device: [cuda]
      n_epochs: [256]
      batch_size: [128]
      patience: [20]
      tabm_k: [16]
  - name: tabicl
    weighting: pooled
    grid:
      device: [cuda]
      n_estimators: [4, 8]
      batch_size: [8]
      checkpoint_version: [tabicl-classifier-v2-20260212.ckpt]
