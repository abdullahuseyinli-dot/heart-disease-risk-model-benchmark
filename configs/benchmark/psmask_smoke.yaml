protocol_version: psmask-smoke-nonconfirmatory
device: cuda
seeds: [17]
inner_mask_replicates: 1
features: [age, sex, cp, trestbps, chol, fbs, restecg, thalach, exang, oldpeak, slope, ca, thal]
data:
  canonical_path: data/processed/uci_heart_canonical_v1.parquet
  outer_manifest: data/splits/uci_heart_outer_loho_v1.parquet
  inner_manifest: data/splits/uci_heart_inner_loho_v1.parquet
common_parameters:
  d_model: 16
  n_heads: 4
  n_layers: 1
  dropout: 0.0
  weight_decay: 0.001
  learning_rate: 0.001
  max_epochs: 2
  evaluation_interval: 1
  patience_evaluations: 2
  validation_mask_replicates: 1
  dro_tau: 0.2
  dro_lambda: 0.5
  brier_beta: 0.0
experiments:
  - name: smoke_v2
    variant: v2
