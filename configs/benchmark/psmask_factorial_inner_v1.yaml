protocol_version: psmask-factorial-inner-v1
device: cuda
seeds: [5062]
inner_mask_replicates: 2
features: [age, sex, cp, trestbps, chol, fbs, restecg, thalach, exang, oldpeak, slope, ca, thal]
data:
  canonical_path: data/processed/uci_heart_canonical_v1.parquet
  outer_manifest: data/splits/uci_heart_outer_loho_v1.parquet
  inner_manifest: data/splits/uci_heart_inner_loho_v1.parquet
selection:
  metric: 0.5_mean_plus_0.5_worst_policy_balanced_log_loss
common_parameters:
  d_model: 64
  n_heads: 4
  n_layers: 2
  dropout: 0.1
  weight_decay: 0.001
  max_epochs: 120
  evaluation_interval: 5
  patience_evaluations: 8
  validation_mask_replicates: 2
  dro_tau: 0.2
  brier_beta: 0.1
experiments:
  - name: v5_site_only_dro
    variant: v5_site
    grid:
      learning_rate: [0.0005, 0.001]
      dro_lambda: [0.25, 0.5, 0.75]
  - name: v5_mask_only_dro
    variant: v5_mask
    grid:
      learning_rate: [0.0005, 0.001]
      dro_lambda: [0.25, 0.5, 0.75]
