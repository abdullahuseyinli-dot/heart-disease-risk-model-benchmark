protocol_version: psmask-inner-v1
device: cuda
seeds: [5062]
inner_mask_replicates: 2
features: [age, sex, cp, trestbps, chol, fbs, restecg, thalach, exang, oldpeak, slope, ca, thal]
data:
  canonical_path: data/processed/uci_heart_canonical_v1.parquet
  outer_manifest: data/splits/uci_heart_outer_loho_v1.parquet
  inner_manifest: data/splits/uci_heart_inner_loho_v1.parquet
selection:
  metric: 0.5_mean_plus_0.5_worst_policy_balanced_log_loss
common_parameters:
  d_model: 64
  n_heads: 4
  n_layers: 2
  dropout: 0.1
  weight_decay: 0.001
  max_epochs: 120
  evaluation_interval: 5
  patience_evaluations: 8
  validation_mask_replicates: 2
  dro_tau: 0.2
  dro_lambda: 0.5
  brier_beta: 0.0
experiments:
  - name: v0_pooled_erm
    variant: v0
    grid:
      learning_rate: [0.0005, 0.001]
  - name: v1_site_balanced
    variant: v1
    grid:
      learning_rate: [0.0005, 0.001]
  - name: v2_prior_separated
    variant: v2
    grid:
      learning_rate: [0.0005, 0.001]
  - name: v3_mcar_augmentation
    variant: v3
    grid:
      learning_rate: [0.0005, 0.001]
  - name: v4_structured_policy_bank
    variant: v4
    grid:
      learning_rate: [0.0005, 0.001]
  - name: v5_site_mask_dro
    variant: v5
    grid:
      learning_rate: [0.0005, 0.001]
      dro_lambda: [0.25, 0.5, 0.75]
  - name: v5_site_mask_dro_brier
    variant: v5
    parameters:
      brier_beta: 0.1
    grid:
      learning_rate: [0.0005, 0.001]
      dro_lambda: [0.25, 0.5, 0.75]
  - name: v7_ane
    variant: v7
    parameters:
      brier_beta: 0.1
    grid:
      learning_rate: [0.0005, 0.001]
      dro_lambda: [0.25, 0.5, 0.75]
