protocol_version: synthetic-mechanism-v1
device: cuda
scenarios: [label_mar, conditional_shift, mnar_outcome]
seeds: [6101, 6102, 6103]
n_per_environment: 500
prevalences: [0.20, 0.40, 0.60, 0.80]
target_policy_match_replicates: 3
common_parameters:
  d_model: 32
  n_heads: 4
  n_layers: 1
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.001
  max_epochs: 100
  evaluation_interval: 5
  patience_evaluations: 8
  validation_mask_replicates: 2
  dro_tau: 0.2
  dro_lambda: 0.5
  brier_beta: 0.0
experiments:
  - name: pooled_erm
    variant: v0
  - name: prior_separated
    variant: v2
  - name: site_mask_dro
    variant: v5
  - name: site_mask_dro_ane
    variant: v7
    parameters:
      brier_beta: 0.1
diagnostic:
  prior_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  bootstrap_repetitions: 199
  mixture_draws: 3
  alpha: 0.05
acceptance_gates:
  adaptation_experiments: [prior_separated, site_mask_dro, site_mask_dro_ane]
  required_seeds_per_cell: 3
  label_mar_minimum_diagnostic_acceptance_rate: 0.50
  label_mar_maximum_mean_mlls_prevalence_absolute_error: 0.12
  label_mar_maximum_mean_adapted_minus_equal_log_loss: 0.0
  conditional_shift_maximum_diagnostic_acceptance_rate: 0.50
  mnar_outcome_maximum_diagnostic_acceptance_rate: 0.50
